name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm -r typecheck
      - run: pnpm -r test

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits instead of racing the running one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://clavis.crawl-proxy.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations run before the new code ships, so the code never meets an older schema.
      # A migration that drops or renames columns must be split: ship code that tolerates
      # both schemas first, then the destructive migration in a later deploy.
      - name: Apply D1 migrations
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply DB --remote
      - name: Build web app
        run: pnpm build
      - name: Deploy Worker
        working-directory: apps/worker
        run: pnpm exec wrangler deploy --message "${{ github.sha }}"
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w '%{http_code}' https://clavis.crawl-proxy.workers.dev/api/v1/health || true)
            # Cloudflare Access redirects unauthenticated callers (302); anything else is a failure.
            if [ "$status" = "302" ] || [ "$status" = "200" ]; then echo "reachable ($status)"; exit 0; fi
            sleep 5
          done
          echo "unexpected status: $status"; exit 1

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Clavis 구조</title>
  <desc id="desc">사람(브라우저)과 AI 에이전트가 Cloudflare Access를 거쳐 clavis Worker 하나에 들어온다. Worker는 React SPA, REST API, MCP, 첨부 파일, 원본 Markdown, 큐 처리, 예약 작업을 맡고 D1, R2, Queues, Workers AI, Vectorize를 쓴다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#59636e"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 15px; font-weight: 600; }
      .sub { font-size: 12px; fill: #59636e; }
      .small { font-size: 11px; fill: #59636e; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12.5px; fill: #0969da; }
      .desc { font-size: 13px; }
      .line { stroke: #59636e; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Card, so the picture reads the same on light and dark pages -->
  <rect x="0.5" y="0.5" width="959" height="499" rx="12" fill="#ffffff" stroke="#d1d9e0"/>

  <!-- Clients -->
  <rect x="32" y="64" width="196" height="76" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="title" x="130" y="96" text-anchor="middle">사람</text>
  <text class="sub" x="130" y="118" text-anchor="middle">브라우저 · 폰</text>

  <rect x="32" y="176" width="196" height="104" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="title" x="130" y="206" text-anchor="middle">AI 에이전트</text>
  <text class="sub" x="130" y="228" text-anchor="middle">MCP · REST</text>
  <text class="small" x="130" y="250" text-anchor="middle">Access 서비스 토큰</text>
  <text class="small" x="130" y="266" text-anchor="middle">+ Bearer clv_…</text>

  <!-- Cloudflare Access -->
  <rect x="264" y="48" width="144" height="248" rx="8" fill="#fff4e8" stroke="#f38020"/>
  <text class="title" x="336" y="152" text-anchor="middle">Cloudflare</text>
  <text class="title" x="336" y="172" text-anchor="middle">Access</text>
  <text class="small" x="336" y="198" text-anchor="middle">사람: 이메일 로그인</text>
  <text class="small" x="336" y="214" text-anchor="middle">에이전트: 서비스 토큰</text>

  <path class="line" d="M228 102 H262" marker-end="url(#arrow)"/>
  <path class="line" d="M228 228 H262" marker-end="url(#arrow)"/>
  <path class="line" d="M408 172 H438" marker-end="url(#arrow)"/>

  <!-- clavis Worker -->
  <rect x="440" y="32" width="488" height="296" rx="8" fill="#ffffff" stroke="#f38020"/>
  <path d="M448 32 H920 A8 8 0 0 1 928 40 V68 H440 V40 A8 8 0 0 1 448 32 Z" fill="#fff4e8"/>
  <line x1="440" y1="68" x2="928" y2="68" stroke="#f38020"/>
  <text class="title" x="460" y="55">clavis Worker</text>
  <text class="small" x="908" y="55" text-anchor="end">Cloudflare Workers · 단일 배포</text>

  <g>
    <text class="mono" x="460" y="93">assets</text>
    <text class="desc" x="612" y="93">React SPA (화면)</text>
    <line x1="456" y1="102" x2="912" y2="102" stroke="#eaeef2"/>
    <text class="mono" x="460" y="127">/api/v1/*</text>
    <text class="desc" x="612" y="127">REST API (Hono + zod-openapi)</text>
    <line x1="456" y1="136" x2="912" y2="136" stroke="#eaeef2"/>
    <text class="mono" x="460" y="161">/mcp</text>
    <text class="desc" x="612" y="161">MCP (stateless)</text>
    <line x1="456" y1="170" x2="912" y2="170" stroke="#eaeef2"/>
    <text class="mono" x="460" y="195">/files/*</text>
    <text class="desc" x="612" y="195">첨부 파일</text>
    <line x1="456" y1="204" x2="912" y2="204" stroke="#eaeef2"/>
    <text class="mono" x="460" y="229">*.md · llms.txt</text>
    <text class="desc" x="612" y="229">원본 Markdown (AI용)</text>
    <line x1="456" y1="238" x2="912" y2="238" stroke="#eaeef2"/>
    <text class="mono" x="460" y="263">queue()</text>
    <text class="desc" x="612" y="263">알림 · Webhook · 의미 색인</text>
    <line x1="456" y1="272" x2="912" y2="272" stroke="#eaeef2"/>
    <text class="mono" x="460" y="297">scheduled()</text>
    <text class="desc" x="612" y="297">야간 백업 · 정리</text>
  </g>

  <!-- Bindings -->
  <path class="line" d="M684 328 V360"/>
  <path class="line" d="M114 360 H846"/>
  <path class="line" d="M114 360 V390" marker-end="url(#arrow)"/>
  <path class="line" d="M297 360 V390" marker-end="url(#arrow)"/>
  <path class="line" d="M480 360 V390" marker-end="url(#arrow)"/>
  <path class="line" d="M663 360 V390" marker-end="url(#arrow)"/>
  <path class="line" d="M846 360 V390" marker-end="url(#arrow)"/>
  <text class="small" x="694" y="350">바인딩</text>

  <rect x="32" y="392" width="164" height="76" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text class="title" x="114" y="424" text-anchor="middle">D1</text>
  <text class="sub" x="114" y="446" text-anchor="middle">SQLite + FTS5 · 문서</text>

  <rect x="215" y="392" width="164" height="76" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text class="title" x="297" y="424" text-anchor="middle">R2</text>
  <text class="sub" x="297" y="446" text-anchor="middle">첨부 · 백업 · 버전 본문</text>

  <rect x="398" y="392" width="164" height="76" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text class="title" x="480" y="424" text-anchor="middle">Queues</text>
  <text class="sub" x="480" y="446" text-anchor="middle">저장 뒤 작업</text>

  <rect x="581" y="392" width="164" height="76" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text class="title" x="663" y="424" text-anchor="middle">Workers AI</text>
  <text class="sub" x="663" y="446" text-anchor="middle">임베딩 (bge-m3)</text>

  <rect x="764" y="392" width="164" height="76" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text class="title" x="846" y="424" text-anchor="middle">Vectorize</text>
  <text class="sub" x="846" y="446" text-anchor="middle">의미 검색 색인</text>
</svg>
